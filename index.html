<script>
var grammarTopics = [
  {id:'g-present',title:'現在形・現在進行形',rule:'現在形は「今」だけでなく、昨日・今日・明日にも続く習慣や状態。進行形は「～している（途中）」を表す。近い未来に確実に起こる場合も進行形で表せる。',examples:['I go to school. → 習慣的に学校に行く','What do you do? → お仕事は何ですか？','They are marrying next week. → 来週結婚します（準備済み）','状態動詞 resemble は基本的に進行形にしない','Mr. Yamane works on... → 定期的・習慣的','Mr. Yamane is working on... → 今まさに取り組んでいる最中'],diagram:'過去  ─────  現在  ─────  未来\n        習慣・状態は時間軸を横断\n\n現在形：昨日も今日も明日も\n現在進行形：今まさにこの瞬間'},
  {id:'g-time',title:'時・条件の副詞節（最重要）',rule:'if / when / unless / as soon as / once / providing の節では、未来の内容でも現在形を使う。主節はそのまま未来形。接続詞の直後はSVがある（空欄には接続詞が入る）。',examples:['If Ms. Fletcher accepts the position, she will travel to client locations.','unless = ～しない限り（従属接続詞・副詞節）','once = いったん～すると（未来でも現在形）','providing (S V), S V → ～ならば、～という条件で','in case (S V) → ～するといけないので、～に備えて'],diagram:'[ If + S + V（現在形）]  →  S + will + V\n            副詞節              主節（未来形）\n\n★ 副詞節内では未来でも現在形！'},
  {id:'g-perfect',title:'完了形の時間イメージ',rule:'完了形は「訳語」ではなく「時間の幅（矢印）」で捉える。just（たった今）・already（すでに）・since（起点）・for（期間）とセット。the board of directors は単数扱い。',examples:['have + p.p.：過去から「今」に繋がっている状態（今に重点）','had + p.p.：過去の一点よりも前の出来事から過去に繋がっている状態','will have + p.p.：未来のある時点までの完了','since：～から（過去の起点）/ for：～の間（期間）'],diagram:'had+p.p.─────── 過去 ──────── 今\n（大過去から過去へ）  have+p.p.（過去→今）\n\n                              今 ───────► 未来の一点\n                                    will have p.p.'},
  {id:'g-subjunctive',title:'仮定法',rule:'現実（直説法）と区別するため時制を一つ後ろへずらす。Sの後の過去形を見て「妄想・仮定」と捉える。If省略→倒置（疑問文と同じ語順）。Without = もし～がなければ。',examples:['仮定法過去：If S + 過去形, S + would + 原形 → 現在の妄想','仮定法過去完了：If S + had p.p., S + would have p.p. → 過去の妄想','未来の仮定：If S + should + 原形, S + would + 原形 → 万が一の未来','倒置例：Had S p.p. ～ / Should S 原形 ～','be動詞の were → 主語に関わらず were で「ありえないこと」を強調','without（前置詞）= if ～がなければ の代用'],diagram:'現実（直説法）→ If I have～\n仮定（妄想）  → If I had～\n                  ↑時制を一つ後ろへ'},
  {id:'g-thatclause',title:'命令系統の動詞とthat節',rule:'suggest / propose / recommend / request / order / decide などの動詞に続く that 節の中は、must ではなく「should + 動詞の原形」または「動詞の原形（仮定法現在）」になる。受動態の場合は should + be + p.p.。',examples:['suggest（提案）/ propose（提案）/ recommend（勧告）','request（要求）/ insist（主張）/ order（命令）/ decide（決定）','構文：S + V(命令系統) + that + S\' + 原形','受動態：should + be + 過去分詞'],diagram:'S + V(suggest etc.) + that + S\' + 動詞の原形\n                              ↑ should省略も可（仮定法現在）'},
  {id:'g-infinitive',title:'不定詞と動名詞',rule:'to不定詞は「未来志向・前向き・プラスイメージ」。動名詞は「反復・中断・逃避・暗いイメージ」を取りやすい。前置詞の後ろは必ず名詞（動名詞）。',examples:['to V をとる動詞：offer / intend / hesitate / refuse / manage / afford / want / wish / hope','動名詞をとる動詞：enjoy / practice / consider / stop / finish / escape / miss / deny / resist / regret / put off','look forward to ～ing（toは前置詞） / object to ～ing / be used to ～ing / on ～ing / spend 時間 ～ing','decide against + 名詞（against は前置詞）','There is no use ～ing：～しても無駄 / be busy ～ing：～するのに忙しい'],diagram:'to V → 未来・前向き（これから～する）\n-ing  ↻ 反復・経験・逃避（すでに～している）\n\n前置詞 + 名詞（動名詞）→ look forward to ～ing'},
  {id:'g-participle',title:'分詞・分詞構文・受動態',rule:'-ing は「させる側・能動」（surprising）、-ed は「させられる側・受け身」（surprised）。自動詞は過去分詞にできない（例：remain）。分詞構文は「副詞」の働きをする（Because SV がまとまったもの）。',examples:['surprising（驚かせるような）/ surprised（驚かされた=驚いた）','confusing / confused / interesting / interested / tiring / tired','( ) , SV ～ → 分詞構文の形と判断','主節Sが「～する」→ ～ing / 主節Sが「～される」→ p.p.','be being p.p.（進行+受）→ ～されている途中 / have been p.p.（完了+受）→ ～されてしまった','appoint (人) as ～ / assign AB（AにBを割り当てる）/ should have + p.p.（～すべきだった）'],diagram:'感情を起こす側 → -ing（surprising）\n感情を受ける側 → -ed（surprised）\n\n動名詞：動詞を名詞化（～すること）\n分詞：動詞を形容詞化（～している）\n分詞構文：動詞を副詞化（文全体を説明）'},
  {id:'g-relative',title:'関係詞（関係代名詞・関係副詞・複合関係詞）',rule:'関係代名詞の後ろは不完全な文（SまたはOが欠ける）。関係副詞の後ろは完全な文。what（名詞節）/ -ever（名詞または副詞の働き）。前置詞の後には必ず名詞（関係代名詞）が来る。関係代名詞 that の前にカンマを打つ用法はない。',examples:['who（人・主格）/ whom（人・目的格）/ whose（人・所有格）/ which（物・主格目的格）/ that（人物両方）','what = the thing which（名詞節をつくる）','whoever / whichever / whatever（複合関係代名詞・名詞節）','whenever / wherever（複合関係副詞）','前置詞 + which + 完全な文（例：in which he lives）','関係詞の直後が名詞のときは whose から考える','that があり直後に動詞 → 関係代名詞'],diagram:'先行詞 + 関係代名詞 + 不完全な文\n先行詞 + 関係副詞  + 完全な文\n\nwhat          + 不完全な文 → 名詞節\n～ever        + SV         → 名詞節・副詞節'},
  {id:'g-compare',title:'比較・最上級',rule:'2者は比較級、3者以上は最上級。superior / inferior / senior / junior / prior / prefer は than ではなく to を使う。the + 比較級 ～, the + 比較級 ～（～すればするほど）。by far / the very で最上級を強調。',examples:['be superior to ～ / be inferior to ～ / be senior to ～ / prior to ～ / prefer A to B','the taller of the two（2者） / the tallest of the three（3者以上）','the second largest city（○番目に～）','by no later than ～（～までに）','far fewer problems / the very best','little → less → least'],diagram:'原級 tall → 比較級 taller than → 最上級 the tallest\n\n2者 → 比較級　｜　3者以上 → 最上級\n\n特殊：superior/inferior は to を使う'},
  {id:'g-nouns',title:'可算・不可算名詞と代名詞',rule:'不可算名詞は形が一定でないもの、目に見えないもの、集合的なもの。単数扱い。another + 可算名詞。every / each / either の後ろは単数形（3つのe）。almost / every / no は代名詞になれない。',examples:['不可算：water / bread / chalk / work / news / advice / information','集合的：baggage / luggage / furniture / equipment','3つのe：each / every / either + 単数名詞','代名詞になれるもの：none / some / any / all / most','代名詞になれないもの：almost / every / no','The number of ～：単数扱い / Members of ～：複数扱い','one（同種の別もの）/ it（同一のもの）/ that（単数名詞を受ける）/ those（複数名詞を受ける）'],diagram:'2つ: one / the other\n3つ以上: one / another / the others\n複数から何人か: some / others\n\nThe number of ～ is （単数）\nMembers of ～ are （複数）'},
  {id:'g-pronouns',title:'代名詞・所有格・数量詞・前置詞',rule:'前置詞の後ろは目的格、名詞の前は所有格。言葉を補わなくても成立するとき→再帰代名詞。many/several + 複数形。much + 不可算名詞。手段の by + 抽象名詞（冠詞なし）。',examples:['I / my / me / mine / myself','前置詞 + 目的格（with me）/ 所有格 + 名詞 / by oneself = on one\'s own','on schedule（接触のon・スケジュール通り）/ on track（予定通り）','until（～までずっと・継続）/ by（～までに・期限）/ as of ～（～以降）','for + 期間 / during + 特定の期間 / while + SV / in + 期間（～後）/ within + 期間（～以内）','印刷物 in / 電波・ネット on（on TV / on the Web site）','手段のby：by car（冠詞なし）/ by a car は「車の近くに」という意味になる'],diagram:'主格 → 所有格 → 目的格 → 所有代名詞 → 再帰代名詞\n  I  →   my   →  me   →   mine     →  myself\n\n時の前置詞：at + 時刻 / on + 曜日・日付 / in + 月・季節・年'},
  {id:'g-posparts',title:'品詞の区別と語尾ルール',rule:'形容詞は名詞を修飾、副詞は名詞以外を修飾。名詞の前に副詞は置けない。自動詞の後ろには副詞（または何もなし）。他動詞の後ろには名詞（目的語）。空所の後ろに目的語がない→受動態。-ly がついているなら副詞。名詞 + ly → 形容詞（friendly など）に注意。',examples:['-tion（名）/ -ance（名）/ -ment（名）/ -ness（名）/ -ty（名）/ -th（名）/ -er/-or（名・人）','-ful（形）/ -al（形）/ -ive（形）/ -ous（形）/ -ant（形）/ -ic（形）/ -able（形）','-ly は通常副詞 / ただし名詞+ly=形容詞（friendly / orderly）','hard → hardly（ほとんど～ない）/ late → lately（最近）/ near → nearly（ほぼ）/ shortly（まもなく）/ highly（大いに）','economic（経済上の・形）/ economics（経済学・名）/ economical（節約的な・形）','respectful（能動：礼儀正しい）/ respectable（受動：尊敬すべき）','envious（能動：うらやましがっている）/ enviable（受動：うらやましい）'],diagram:'名詞  →形容詞→ 副詞\nbried → brief → briefly\nfriend → friendly（形容詞！）\n\nbe動詞 + 形容詞（補語）\n他動詞 + 名詞（目的語） → 目的語なし → 受動態'},
  {id:'g-conj',title:'接続詞の分類と名詞節',rule:'等位接続詞（and/but/or）は語と語・節と節をつなぐ。従属接続詞（because/although/if/when等）は副詞節を作る。that/if/whetherのみ名詞節も作る（後ろは完全な文）。接続詞内では主語が同じでbe動詞なら省略可能（While (S V), S V → While V-ing, S V）。',examples:['等位接続詞：and / but / or','従属接続詞（When/if型）：because / although / once / providing / in case','名詞節を作る従属接続詞：that / if / whether のみ（後ろは完全な文）','that の例：I know (that + 完全文) → 名詞節','if の例：I don\'t know (if + 完全文) → ～かどうか','whether の例：I don\'t know (whether + 完全文) → ～かどうか','接続詞の省略条件：①主語が同じ ②be動詞 → While (S V), S V → While V-ing, S V','once（接続詞）：一旦～すると（未来でも現在形）/ in case：～するといけないので / providing：～ならば','as の使い分け：前置詞（～として）/ 接続詞（～なので）'],diagram:'等位接続詞：A and/but/or B\n従属接続詞：(Because S V), S V → 副詞節\n\n名詞節を作る：that / if / only\n  that + 完全文 → 名詞節\n  what + 不完全文 → 名詞節（関係代名詞）\n\n省略：主語が同じ＋be動詞 → While V-ing, S V'},
  {id:'g-causative',title:'使役動詞とSVOC',rule:'make/have/let + O + 原形（～に～させる）。help + O + 原形（to省略可）。その他の動詞（allow/permit/expect/enable/invite/persuade）+ O + to～。SVOCでCに形容詞がくる動詞：make/find/leave/keep/get。',examples:['使役動詞：make / have / let + O + 原形 → Oに～させる','help + O + 原形（to省略可）/ help + O + to～','allow + O + to～ / permit + O + to～ / expect + O + to～','enable + O + to～（～することを可能にする）/ invite + O + to～（～するよう勧める）','persuade + O + to～（～するよう説得する）','受身：O is allowed to～ / O is expected to～','SVOC（C=形容詞）：make / find / leave / keep / get + O + C','The news made me happy. / I find the book interesting. / leave the window open.','strict（形：厳しい）/ strictly（副：厳重に）/ confidential（形：機密の）','inquire（問い合わせる）/ require（必要とする）の区別'],diagram:'使役動詞：make/have/let + O + 原形\n          help + O + 原形（to省略可）\n\nその他：allow/permit/expect/enable + O + to～\n\nSVOC（C=形容詞）：\n  make O C → The news made me happy\n  find O C → I find the book interesting\n  leave O C → leave the window open'},
  {id:'g-prep',title:'前置詞の概念・意味',rule:'on=接触、until=継続、by=期限、for=期間、during=特定の期間、while+SV、in+期間=～後、within+期間=～以内。印刷物はin、電波・ネットはon。動詞+前置詞：protect A from B / be relevant to / help A with B。原因・理由：on account of / due to / owing to / thanks to / as a result of。',examples:['on（接触）：on the wall / on schedule（予定通り）/ on track / depend on / It\'s on me.','until（～までずっと・継続）/ by（～までに・期限）','while + SV / during + 名詞（特定の期間）/ for + 期間','in + 期間（～後・ピンポイント）/ within + 期間（～以内）','印刷物：in the magazine / in the book','電波・ネット：on TV / on the Web site','protect A from B / be relevant to ～ / help A with B','look forward to ～ing（toは前置詞）/ keep up with ～（遅れずついていく）','原因・理由：on account of / due to / owing to / thanks to / as a result of','時の前置詞：at + 時刻 / on + 曜日・日付 / in + 月・季節・年','as of ～（～以降）/ in no time（すぐに）/ in a moment（すぐに）'],diagram:'on = 接触      → on the wall, on schedule\nuntil = 継続    → until 5時（ずっと）\nby = 期限      → by 5時（までに）\nfor = 期間     → for 3 hours\nduring = 特定期間 → during the summer\nwhile + SV     → while I was working\nin + 期間 = ～後 → in 30 minutes（30分後）\nwithin + 期間 = ～以内 → within 30 minutes'}
];

      {type:'text',title:'形容詞の後置修飾',body:'The person in charge of the training seminar was disappointed to hear there were only a few people ( present ). 空所の前のonly a few peopleという名詞句を修飾する語として形容詞present「出席した」を選ぶ。英語の形容詞は通常「a present member（出席のメンバー）」のように名詞の前に置かれる。しかし、「出席している」という意味で使うpresentは、名詞の直後に置かれるというルールがある。→ there were [only a few people] present.（出席している人は、わずか数人しかいなかった）。'},
      {type:'text',title:'構文を取る力が必要な問題（態）',body:'Flood barriers along the Lye River ( ) to help prevent another disaster like the one last year. 述語動詞constructの適切な形を選ぶ。空所の後ろには目的語となる名詞がないので、動詞は受動態になるとわかる。したがってhave been constructedが適切。構文を取る力が必要な問題：主語と動詞の関係をとる→「する」のか「される」のか。目的語がない→受動態。'},
      {type:'text',title:'時制の判断',body:'The company that specializes in job placement - three factory workers today. send→sendsではないので×、sending→進行形はbe動詞必要、will send→今日のことなので未来形で正解、had been sending→ある過去からある過去への「→」のイメージ。文法上成立するものを選ぶ（3単現のsがあるかどうかにも注意）→時制の観点から正しいか→意味上正しいか。'},

      {type:'text',title:'重要な文法メモ',body:'空所の後ろに目的語（名詞）がない→動詞は受動態になる。'},

      {type:'examples',title:'例文',items:[

      {type:'text',title:'be entitled to do',body:'Every customer whose membership at Chime Digital Store is three years or more is entitled to receive a premium coupon at the counter. 動詞entitleの適切な形を選ぶ。be entitled to doで「～する資格がある」。主語がEvery customerと単数形なのでis entitledが適切。'},
      {type:'list',title:'判断の手順',items:[

        '2. 能動態か受動態かの判断：「空所の後ろに目的語（名詞）がない→動詞は受動態になる」。entitledの後ろにあるのはto receive...（不定詞）であり、名詞（目的語）が続いていない。したがって能動態のentitlesではなく受動態のis entitledが正解',

      {type:'text',title:'代名詞の目的格',body:'Mrs. Herrera indicated that all questions regarding the new policies should be sent to her by e-mail. 空所の前には前置詞toがあり、後ろには前置詞byがあるので、空所には目的格のherが適切。動詞の形：be sent to ～（～に送られる）という受動態。文法ルール：前置詞toの後ろにはその動作を受ける対象（目的語）が必要。代名詞の選択：she（主格）/ her（所有格/目的格）/ hers（所有代名詞）。今回はtoの後ろなので目的格のherが正解。'},

      {type:'text',title:'接続詞と前置詞',body:'The top prize was awarded to the promising new writer, ( ) the fact that his book was severely criticized by some of the judges. 空欄の後はthe factの名詞のため、空欄は前置詞である。although→接続詞、because→接続詞、due to→前置詞、despite→前置詞。'},
      {type:'list',title:'接続詞と前置詞の整理',items:[

      {type:'text',title:'比較',body:'Grantham Chemicals chose to build its new plant in Hyderabad, as it was the ( ) of the two possible options. 空所の前には冠詞theがある。＜the＋比較級 of the two ～＞で「2つの～のうち…な方」という意味。したがってcheaperが適切。2つのものを比べる際は最上級は使わない。'},

      {type:'text',title:'現在分詞と過去分詞の基本',body:'分詞は「動詞を形容詞化したもの」であり、名詞を説明する役割を持つ。現在分詞（~ing）：「～している」という形容詞の役割。進行している能動的な状態を表す。過去分詞（p.p.）：「～された」という形容詞の役割。受け身（受動）の状態を表す。注意点：自動詞は目的語を取らないため、過去分詞（受け身）にはできない（例：remain）。'},
      {type:'text',title:'感情系動詞の識別（-ing vs -ed）',body:'感情を表す動詞は基本的に「～させる」という意味を持つため、分詞にする際の解釈に注意。-ing（現在分詞）：「（主語が何かを）～させるような」という性質。例：surprising（驚かせるような）、confusing（混乱させるような）。-ed（過去分詞）：「（主語が何かによって）～させられた＝～した」という感情の状態。例：surprised（驚かされた＝驚いた）。'},
      {type:'text',title:'分詞構文',body:'分詞構文は動詞が「副詞」の働きをするもので、接続詞（Becauseなど）が含まれる節を簡略化した形。基本構造：(～ing～), S + V ～。役割：(～ing～)は副詞のカタマリとして、メインの文（主節）に情報を付け加える。解法のポイント：主節の主語（S）が分詞部分の動作の主語となる。主語（S）が「～する」（能動）の関係なら→現在分詞（~ing）を使う。主語（S）が「～される」（受動）の関係なら→過去分詞（p.p.）を使う。'},
      {type:'text',title:'動名詞との違い',body:'動名詞：動詞を名詞化したもの。「～すること」という意味で、文の主語や目的語になる。分詞：動詞を形容詞化したもの。「～している」という意味で、名詞を修飾する。分詞構文：動詞を副詞化したもの。文全体を説明する。'},

      {type:'text',title:'put aside の3つの意味',body:'1. 物理的に「脇に置く」：Put your phone aside and focus on the lesson.（スマホを脇に置いて、レッスンに集中しなさい）。2. お金などを「取っておく・蓄える」：I put aside $200 every month for my vacation.（休暇のために、毎月200ドルを取っておいている）。3. 感情や問題を「無視する・棚上げする」：Let\'s put aside our differences and work together.（違いはさておき、協力しましょう）。'},

      {type:'text',title:'refer to と reference',body:'1. refer to ～（動詞句）：「～を参照する」「～に言及する」。参照する＝資料などを見る。言及する＝会議などで「～について触れる・話に出す」。例：He referred to the new project in the meeting.（彼は会議で新しいプロジェクトについて言及した）。2. reference（名詞）：「参照」「言及」。in reference to ～：「～に関して」（＝about / regarding）。ビジネスメールの件名や冒頭で「～の件についてですが」と言う時に使われる公式な表現。reference book：「参考図書」。通読するのではなく必要な時に参照するための本。推薦状・身元照会先：就職活動などで前の職場の上司などに「この人は信頼できます」と言及してもらうことをreferenceと言う。referenceは「（問い合わせ先としての）照会先」というニュアンスが強い。'},

      {type:'text',title:'be pleased to do',body:'「～することに喜びを感じている」→「喜んで～します」。個人の場合：I am pleased to meet you.（お会いできて嬉しいです）。会社の場合：Reynolds Manufacturing is pleased to offer...（レイノルズ社は、～を提供できることを嬉しく思います）。言い換え表現（TOEIC頻出）：be delighted to do（さらに強く～することを大変嬉しく思う）、be happy to do（～することを嬉しく思う、少しカジュアル）。be pleased with + 名詞：「～（結果など）に満足している」。例：We are pleased with the results.'},
      {type:'examples',title:'例文',items:[

      {type:'text',title:'Proofread',body:'「Proof（プルーフ）」は「試し刷り」のこと。もともと印刷業界では本番の印刷に入る前に間違いがないか確認するためのテスト用の刷り物をProofと呼んでいた。「Proof」の本来の意味は「試練・検証」（ラテン語のprobare「試す、確認する」から）。Waterproof：水の浸入を「試して、耐える」→防水。Proofread：試し刷りを「読んで、検証する」→校正。Editは内容をより良く修正する、Proofreadはタイポや文法のミスを最終チェックする。'},

        'make available for～：「～に供する」','reward：「～に報いる」','bank transfer：銀行振込',
        'reward A by -ing：Aに～することで報いる','manage to do：～を何とかやり遂げる'
      ]},
      {type:'table',title:'compete 関連',rows:[
        ['compete','動詞','競争する'],
        ['competition','名詞','競争、競技会'],
        ['competitor','名詞','競争相手、ライバル'],
        ['competitive','形容詞','競争の、競争力の高い'],
        ['competence','名詞','能力、適性'],
        ['competent','形容詞','能力のある、有能な']
      ]},
      {type:'list',title:'語彙',items:[
        'patient：名詞→患者、形容詞→忍耐強い','compliment：敬意を表する','team up with ～：～と協力する'
      ]},
      {type:'examples',title:'例文',items:[
        'Mel is teaming up with the brightest young chefs in Wellington to offer an exciting menu of local produce to compliment the great entertainment. → Melは素晴らしいショーに敬意を表するべく、Wellingtonの素晴らしい若手シェフと協力してその土地の生産物を使った心躍るメニューを提供するつもりです。'
      ]},
      {type:'list',title:'語彙',items:[
        'be bound to do：～する運命にある','exceptional：例外の','excessive：過度の'
      ]},
      {type:'examples',title:'例文',items:[
        'Customers may want to reserve a table, however, as the restaurant is bound to fill up quickly due to the increasing popularity of the Evans Bay area. → しかし、レストランはEvans Bayエリアの人気上昇もありすぐに満席になることは必至なので、よかったらテーブルを予約してください。',
        'I am writing to complain about excessive noise from an establishment called "Mel\'s Piano Bar & Restaurant". → 「Melピアノバー＆レストラン」という施設の過度な騒音について苦情を言うためにメールしています。',
        'The changes will come into effect October 1. → この変更は10月1日に発効される。'
      ]},
      {type:'list',title:'Ensure / Assure / Reassure',items:[
        'Ensure：（物事を）確実にする、保証する','Assure：（人に）保証する、請け負う',
        'Reassure：（人を）安心させる（不安を取り除く）→懸念をなくす'
      ]},
      {type:'list',title:'語彙',items:[
        'seamlessly：つなぎめなく','commentary：解説'
      ]},
      {type:'examples',title:'例文',items:[
        'All of this is linked together seamlessly in Dr. Karner\'s fascinating commentary. → これら全てが、Karner教授の魅惑的な解説の中でつなぎ目なく一緒に結び付けられます。'
      ]},
      {type:'table',title:'Commentary / Complaint / Comment',rows:[
        ['Commentary','名詞','解説、実況'],
        ['Complaint','名詞','苦情、不満'],
        ['Comment','名詞/動詞','意見、評言']
      ]},
      {type:'list',title:'語彙',items:[
        'other than～：～を除き','on behalf of～：～を代表して'
      ]},
      {type:'examples',title:'例文',items:[
        'I don\'t know anyone other than you. → あなた以外の人は知らない（＝あなたしか知らない）',
        'On behalf of my company → 会社を代表して'
      ]},
      {type:'table',title:'Dispute / Struggle / Depart',rows:[
        ['Dispute','論争・議論する','Dis（反対の）意見をpute（述べる）'],
        ['Struggle','もがく・努力する','泥沼の中でジタバタしている必死な感じ'],
        ['Depart','離れる・出発する','飛行機の「デパーチャー」']
      ]},
      {type:'table',title:'Reminder と Remainder',rows:[
        ['Reminder','思い出させるもの','Remind（思い出させる）+ -er。忘れないように通知する「リマインダー」'],
        ['Remainder','残り、余り','Remain（残る）+ -der。算数の余りや、売れ残りの本など']
      ]},
      {type:'list',title:'語彙',items:[
        'gene：遺伝子','compile：積み上げる、集める',
        'sluggish：不景気の（"slug"（ナメクジ）＋-ish（～のような）。ナメクジのように動きがノロノロしている状態）',
        'therefore：したがって','congestion：渋滞','general affair：総務','carpool：車の相乗りをする',
        'throw a party：パーティーを開く','starring：スターにする→主演の','bind：しばる、まとめる',
        'discount on～：～に対して割引する（onのイメージ：グッと押す感じ）','subtitle：字幕','honor：～を讃える',
        'bulk order：大量注文','cause A to do：Aに～させる'
      ]},
      {type:'examples',title:'例文',items:[
        'He has been a great leader and I\'d like to throw a farewell party for him next Friday. → 彼は優れた指導者でしたので、このたびは来週の金曜日に彼の送別会を開催したいと思います。'
      ]},
      {type:'list',title:'語彙',items:[
        'relieve：緩和する','retrieve：～を検索する（「リトリーブ」に聞こえる）',
        'patron：お得意様（お金をたくさん出してくれる人）','patronage：ご愛顧（「ペートレネージ」に聞こえる）',
        'compensation：償い、埋め合わせ','merely：単に','intermediate：中級の','aromatic：香り高い','the public：市民',
        'solicit：「孤独（soli / ソロ）で不安なので、いろいろ求める」→懇願する、求める'
      ]},
      {type:'examples',title:'例文',items:[
        'It seems there was a mix-up in retrieving the book from our database using the ISBN number, and we mistakenly sent you the wrong book. → 私共のデータベースからISBN番号を使用して本を検索する際に取り違えがあったために、間違った本を誤ってお送りしてしまったようです。',
        'Thank you for your patronage, and we look forward to serving you again in the future. → ご愛顧ありがとうございます、今後のまたのご利用をお待ちしております。',
        'And as compensation for your trouble, we will refund the extra amount you paid for delivery. → そして、ご迷惑をおかけした埋め合わせとして、配送に追加でお支払いになった金額を返金させていただきます。',
        'I do not speak German, but I have business level English skills, and intermediate Spanish skills. → ドイツ語は話しませんがビジネスレベルの英語能力と中級レベルのスペイン語能力を持っています。'
      ]},
      {type:'table',title:'Dedicate と Delicate',rows:[
        ['Dedicate','捧げる、落成する'],
        ['Delicate','繊細な、壊れやすい']
      ]},
      {type:'examples',title:'例文',items:[
        'Overall, reception by the public has been very positive. → 一般市民の受け止め方は全体的にとても好意的なものだ。',
        'The movie is expected to win various awards, including the prestigious Tom award, due to its stunning cinematography. → 息をのむほど見事な映画撮影技術のおかげで、この映画は名誉あるTom賞を含むさまざまな賞を獲得することが期待されている。',
        'solicit feedback from customers → 顧客からのフィードバックを求める'
      ]}
    ]
};
</script>

<script>
// State
var missed = new Set(JSON.parse(localStorage.getItem('toeic-missed') || '[]'));
var review = false;
var query = '';

// SVG icons
var I = {
  bookOpen: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
  gitBranch: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>',
  listChecks: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  rotateCcw: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>',
  arrowDown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>',
  chevronDown: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  chevronUp: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  checkCircle: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>',
  library: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>',
  target: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>'
};

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function saveMissed() { localStorage.setItem('toeic-missed', JSON.stringify([...missed])); }
function toggleMiss(id) { if (missed.has(id)) missed.delete(id); else missed.add(id); saveMissed(); render(); }
function toggleReview() { review = !review; render(); }

function sectionHeader(num, kicker, title, desc) {
  return '<div class="section-heading"><span>'+num+'</span><div><p>'+kicker+'</p><h2>'+title+'</h2><div class="bronze-line"></div><p class="section-description">'+desc+'</p></div></div>';
}

function hero() {
  return '<header id="top" class="archive-hero">'+
    '<img src="https://media.base44.com/images/public/6a926c867b5892127bd56ed4/fb50a246d_generated_bb63a318.png" alt="上質なノートに触れる万年筆" class="hero-image"/>'+
    '<div class="hero-shade"></div>'+
    '<div class="hero-copy"><p class="eyebrow">THE ARCHIVE OF FLUENCY</p><h1>YOUR TOTAL<br/>TOEIC BLUEPRINT.</h1>'+
    '<p>知識を読むだけで終わらせない。理解し、解き、ミスだけを研ぎ直すための言語設計図。</p>'+
    '<a href="#grammar">学習を始める '+I.arrowDown+'</a></div></header>';
}

function grammarCard(t) {
  var isMissed = missed.has(t.id);
  var h = '<article class="study-card grammar-card'+(isMissed?' is-missed':'')+'">'+
    '<header class="grammar-header"><span class="grammar-num">BLUEPRINT '+t.id.replace('g-','').toUpperCase()+'</span>'+
    '<button class="grammar-miss-btn" data-miss="'+t.id+'">'+(isMissed?I.check+' 復習対象':I.rotateCcw+' ミスした')+'</button></header>'+
    '<h3>'+esc(t.title)+'</h3>'+
    '<div class="grammar-block"><div class="grammar-label">'+I.bookOpen+' <span>ルール</span></div><p class="grammar-rule">'+esc(t.rule)+'</p></div>';
  if (t.diagram) h += '<div class="grammar-block"><div class="grammar-label">'+I.gitBranch+' <span>構文図</span></div><pre class="syntax-diagram">'+esc(t.diagram)+'</pre></div>';
  if (t.examples && t.examples.length) {
    h += '<div class="grammar-block"><div class="grammar-label">'+I.listChecks+' <span>例文</span></div><ul class="grammar-examples">';
    t.examples.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; });
    h += '</ul></div>';
  }
  h += '</article>';
  return h;
}

function grammarSection() {
  var shown = review ? grammarTopics.filter(function(t){return missed.has(t.id);}) : grammarTopics;
  var h = '<section id="grammar" class="zone grammar-zone">'+
    sectionHeader('01','THE GRAMMAR BLUEPRINT','基本文法','時制・構文・品詞を、時間軸と構造図で分解。PDFの講義内容を問題解決の順序に並べ直しました。')+
    '<div class="grammar-grid">';
  shown.forEach(function(t){ h += grammarCard(t); });
  h += '</div>';
  if (!shown.length) h += '<p class="empty-review">復習対象の基本文法はありません。</p>';
  h += '</section>';
  return h;
}

function vocabCard(w) {
  var isMissed = missed.has(w.id);
  return '<article class="vocab-card item'+(isMissed?' is-missed':'')+'" tabindex="0">'+
    '<span class="vocab-no">'+w.id.toUpperCase()+'</span><h3>'+esc(w.english)+'</h3>'+
    '<button class="reveal" aria-label="'+esc(w.english)+'の日本語訳を表示"><span>'+esc(w.japanese)+'</span><small>CLICK TO REVEAL</small></button>'+
    '<button class="miss-dot" data-miss="'+w.id+'">'+(isMissed?I.check:I.rotateCcw)+' '+(isMissed?'REVIEW':'MARK')+'</button></article>';
}

function vocabSection() {
  var q = query.toLowerCase();
  var shown = vocabulary.filter(function(w){return (!review||missed.has(w.id)) && w.english.toLowerCase().includes(q);});
  var h = '<section id="vocabulary" class="zone vocab-zone">'+
    '<div class="zone-visual"><img src="https://media.base44.com/images/public/6a926c867b5892127bd56ed4/e168c61dc_generated_d0587317.png" alt="紙に広がるインクと古書"/></div>'+
    sectionHeader('02','THE LEXICAL VAULT','単語','英語を見て意味を想起し、クリックして答え合わせ。復習対象は端末に保存されます。')+
    '<input value="'+esc(query)+'" oninput="onSearch(this.value)" class="vocab-search" placeholder="英単語を検索…" aria-label="英単語を検索"/>'+
    '<div class="vocab-grid">';
  shown.forEach(function(w){ h += vocabCard(w); });
  h += '</div>';
  if (!shown.length) h += '<p class="empty-review">該当する単語はありません。</p>';
  h += '</section>';
  return h;
}

function strategyCard(item) {
  var id = 'part-'+item.part;
  var isMissed = missed.has(id);
  var h = '<article class="part-card item'+(isMissed?' is-missed':'')+'">'+
    '<div class="part-number">PART <strong>'+item.part+'</strong></div><div>'+
    '<span>'+item.kind+'</span><h3>'+esc(item.title)+'</h3>'+
    '<p style="margin-bottom:14px">'+esc(item.focus)+'</p>';
  if (item.points && item.points.length) {
    h += '<button class="points-toggle" data-strategy="'+item.part+'">'+I.chevronDown+' 詳細を展開する</button>'+
      '<ul class="part-points" id="sp-'+item.part+'" style="display:none">';
    item.points.forEach(function(p){ h += '<li>'+esc(p)+'</li>'; });
    h += '</ul>';
  }
  h += '<div class="simulation"><p>TACTICAL CHECK</p>'+
    '<label><input type="checkbox"/> 解答前に根拠を特定した</label>'+
    '<label><input type="checkbox"/> 時間配分を守った</label></div>'+
    '<button data-miss="'+id+'">'+(isMissed?I.checkCircle:I.rotateCcw)+' '+(isMissed?'復習対象':'ミスした')+'</button>'+
    '</div></article>';
  return h;
}

function strategySection() {
  var shown = review ? parts.filter(function(x){return missed.has('part-'+x.part);}) : parts;
  var h = '<section id="strategy" class="zone strategy-zone">'+
    '<div class="strategy-intro">'+
    sectionHeader('03','THE STRATEGIC THEATER','Part別対策','基本文法・単語とは混ぜず、TOEIC Part 1〜7の解答動作だけを訓練します。')+
    '<img src="https://media.base44.com/images/public/6a926c867b5892127bd56ed4/23d57cd29_generated_b22cbd9c.png" alt="時計と鉛筆を整えた試験学習机"/></div>'+
    '<div class="parts-list">';
  shown.forEach(function(x){ h += strategyCard(x); });
  h += '</div>';
  if (!shown.length) h += '<p class="empty-review">復習対象のPartはありません。</p>';
  h += '</section>';
  return h;
}

function contentBlock(s) {
  var h = '<div class="transcript-section">';
  if (s.title) h += '<h4 class="transcript-h4">'+esc(s.title)+'</h4>';
  if (s.body) h += '<p class="transcript-body">'+esc(s.body)+'</p>';
  if (s.items) { h += '<ul class="transcript-list">'; s.items.forEach(function(i){h+='<li>'+esc(i)+'</li>';}); h += '</ul>'; }
  if (s.examples) { h += '<ul class="transcript-examples">'; s.examples.forEach(function(e){h+='<li>'+esc(e)+'</li>';}); h += '</ul>'; }
  if (s.rows) {
    h += '<div class="transcript-table-wrap"><table class="transcript-table"><tbody>';
    s.rows.forEach(function(row,i){
      h += '<tr>'; row.forEach(function(cell,j){ h += '<td'+(j===0?' class="transcript-td-key"':'')+'>'+esc(cell)+'</td>'; }); h += '</tr>';
    });
    h += '</tbody></table>';
    if (s.note) h += '<p class="transcript-note">'+esc(s.note)+'</p>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function partBlock(p) {
  var h = '<article class="part-card item transcript-part" id="ta-'+p.part+'">'+
    '<div class="part-number">PART <strong>'+p.part+'</strong></div><div>'+
    '<span>'+p.kind+'</span><h3>'+esc(p.title)+'</h3>'+
    '<p style="margin-bottom:14px">'+esc(p.intro)+'</p>'+
    '<button class="points-toggle" data-archive="'+p.part+'">'+I.chevronDown+' 全文を展開する</button>'+
    '<div class="transcript-content" id="tc-'+p.part+'" style="display:none">';
  p.sections.forEach(function(s){ h += contentBlock(s); });
  h += '</div></div></article>';
  return h;
}

function transcribedArchive() {
  var h = '<section id="sources" class="zone source-zone">'+
    sectionHeader('04','UNABRIDGED TRANSCRIPTION','パート別対策 全文','パート別対策PDFの全内容を、欠落なく静的HTML内に転記しています。各Partを展開して全文をお読みください。')+
    '<div class="parts-list">';
  strategyContent.forEach(function(p){ h += partBlock(p); });
  h += '</div></section>';
  return h;
}

function footer() {
  return '<footer><p>THE ARCHIVE OF FLUENCY</p><span>ACADEMIC PRECISION FOR TOEIC MASTERY</span><a href="#top">INDEXへ戻る</a></footer>';
}

function sideIndex() {
  var items = [['grammar','基本文法',I.bookOpen],['vocabulary','単語',I.library],['strategy','Part別対策',I.target],['sources','原文全ページ',I.rotateCcw]];
  var h = '<aside class="knowledge-index"><a href="#top" class="index-mark" aria-label="先頭へ">AF</a><nav>';
  items.forEach(function(it){
    h += '<a href="#'+it[0]+'">'+it[2]+'<span>'+it[1]+'</span></a>';
  });
  h += '</nav><button onclick="toggleReview()" class="'+(review?'review-active':'')+'">'+I.rotateCcw+'<span>'+(review?'全件表示':'ミスのみ')+'</span></button></aside>';
  return h;
}

function onSearch(v) { query = v; render(); var i = document.querySelector('.vocab-search'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }

function render() {
  var app = document.getElementById('root');
  app.className = review ? 'archive review-mode' : 'archive';
  app.innerHTML = sideIndex() + '<main>' + hero() + grammarSection() + vocabSection() + strategySection() + transcribedArchive() + '</main>' + footer();
  // Attach event listeners via delegation
  app.addEventListener('click', handleClick);
}

function handleClick(e) {
  var missBtn = e.target.closest('[data-miss]');
  if (missBtn) { e.preventDefault(); toggleMiss(missBtn.getAttribute('data-miss')); return; }
  var stratBtn = e.target.closest('[data-strategy]');
  if (stratBtn) {
    var part = stratBtn.getAttribute('data-strategy');
    var ul = document.getElementById('sp-'+part);
    var open = ul.style.display !== 'none';
    ul.style.display = open ? 'none' : 'block';
    stratBtn.innerHTML = (open?I.chevronDown:I.chevronUp)+' '+(open?'詳細を展開する':'詳細を閉じる');
    return;
  }
  var archBtn = e.target.closest('[data-archive]');
  if (archBtn) {
    var part = archBtn.getAttribute('data-archive');
    var tc = document.getElementById('tc-'+part);
    var open = tc.style.display !== 'none';
    tc.style.display = open ? 'none' : 'block';
    archBtn.innerHTML = (open?I.chevronDown:I.chevronUp)+' '+(open?'全文を展開する':'全文を閉じる');
    var art = document.getElementById('ta-'+part);
    if (open) art.classList.remove('expanded'); else art.classList.add('expanded');
    return;
  }
}

window.onSearch = onSearch;
window.toggleReview = toggleReview;
window.toggleMiss = toggleMiss;
render();
</script>
  </body>
</html>
